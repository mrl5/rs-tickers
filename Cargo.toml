[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[workspace.dependencies]
rs-tickers = { path = "./crates/rs-tickers" }

atty = "^0"
either = "^1"
env_logger = "^0"
log = "^0"
once_cell = "^1"
reqwest = "^0"
scraper = "^0"
serde = "^1"
serde_json = "^1"
structopt = "^0"
